[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gnd-wikidata-resolver"
version = "0.1.1"
authors = [
  { name="Gentiana Rashiti", email="gentiana.rashiti@library.ethz.ch" },
]
description = "Resolve Wikidata Q-IDs to GND IDs and classify items with multiple GND IDs"
readme = "README.md"
requires-python = ">=3.10"
classifiers = [
    "Programming Language :: Python :: 3"
]
license = "MIT"
license-files = ["LICEN[CS]E*"]
dependencies = ["requests>=2.31"]

[project.urls]
Homepage = "https://github.com/rashitig/gnd-wikidata-resolver"

[project.optional-dependencies]
dev = ["pytest", "ruff"]

[tool.setuptools.packages.find]
where = ["src"]